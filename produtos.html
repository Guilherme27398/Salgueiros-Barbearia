<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos · Salgueiro's Barbearia</title>
  <meta name="description" content="Produtos para cabelo, barba e moda da Salgueiro's Barbearia.">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" href="assets/images/logo/logo-salgueiros.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/produtos.css">
  <script src="js/dados.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/loja.js" defer></script>
  <script src="js/produtos.js" defer></script>
</head>
<body data-pagina="produtos">

  <!-- Navbar, menu mobile e rodapé são montados por js/main.js -->

  <main>

    <!-- ===== CABEÇALHO DA PÁGINA ===== -->
    <!-- Fotografia própria (IMAGENS.heroProdutos); o enquadramento vem de .pagina-hero--produtos -->
    <section class="pagina-cabecalho pagina-hero pagina-hero--produtos">
      <div class="pagina-hero__fundo media" data-imagem="heroProdutos" data-alt="" data-label="Fotografia dos produtos · 16:9"></div>
      <div class="container">
        <nav aria-label="Caminho">
          <ol class="migalhas">
            <li><a href="index.html">Início</a></li>
            <li aria-current="page">Produtos</li>
          </ol>
        </nav>
        <h1 class="pagina-cabecalho__titulo">Produtos</h1>
        <p class="pagina-cabecalho__texto">O que o barbeiro usa e recomenda, para o cabelo, para a barba e para vestir. Disponível na barbearia.</p>
      </div>
    </section>

    <!-- ===== CATÁLOGO ===== -->
    <section class="produtos" aria-label="Catálogo de produtos">
      <div class="container">

        <!-- Pesquisa em destaque, a toda a largura -->
        <form class="produtos__pesquisa" id="produtos-pesquisa" role="search">
          <div class="campo campo--pesquisa campo--grande">
            <label class="sr-only" for="pesquisa">Pesquisar produtos</label>
            <svg class="icone" aria-hidden="true"><use href="#i-pesquisa"></use></svg>
            <input class="campo__controlo" type="search" id="pesquisa" placeholder="Pesquisar produtos, por exemplo «cera»" autocomplete="off">
          </div>
        </form>

        <div class="produtos__corpo">

          <!-- ===== FILTROS (coluna da esquerda; em ecrãs estreitos abre e fecha) ===== -->
          <aside class="filtros" aria-label="Filtros">
            <details class="filtros__caixa" id="filtros">
              <summary class="filtros__alternar">
                <span>Filtros <span class="filtros__ativos" id="filtros-ativos"></span></span>
                <svg class="icone" aria-hidden="true"><use href="#i-seta-baixo"></use></svg>
              </summary>

              <form class="filtros__form" id="produtos-filtros">

                <fieldset class="filtros__grupo">
                  <legend class="filtros__titulo">Categorias</legend>
                  <ul class="filtros__categorias" id="categorias"></ul>
                </fieldset>

                <fieldset class="filtros__grupo">
                  <legend class="filtros__titulo">Preço</legend>
                  <div class="intervalo" id="preco-intervalo">
                    <div class="intervalo__barra" aria-hidden="true"></div>
                    <input class="intervalo__cursor" type="range" id="preco-min-barra" step="1" aria-label="Preço mínimo">
                    <input class="intervalo__cursor" type="range" id="preco-max-barra" step="1" aria-label="Preço máximo">
                  </div>
                  <div class="intervalo__campos">
                    <label class="intervalo__campo" for="preco-min">
                      <span>De</span>
                      <input class="campo__controlo" type="number" id="preco-min" step="1" inputmode="decimal">
                      <span aria-hidden="true">€</span>
                    </label>
                    <label class="intervalo__campo" for="preco-max">
                      <span>até</span>
                      <input class="campo__controlo" type="number" id="preco-max" step="1" inputmode="decimal">
                      <span aria-hidden="true">€</span>
                    </label>
                  </div>
                </fieldset>

                <fieldset class="filtros__grupo">
                  <legend class="filtros__titulo">Ordenar por</legend>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="nome-asc" checked><span>Nome (A–Z)</span></label>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="nome-desc"><span>Nome (Z–A)</span></label>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="preco-asc"><span>Preço (mais baixo primeiro)</span></label>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="preco-desc"><span>Preço (mais alto primeiro)</span></label>
                </fieldset>

                <fieldset class="filtros__grupo">
                  <legend class="filtros__titulo">Disponibilidade</legend>
                  <label class="caixa"><input class="campo__caixa" type="checkbox" id="so-stock"><span>Só produtos em stock</span></label>
                  <label class="caixa"><input class="campo__caixa" type="checkbox" id="so-destaques"><span>Só destaques do barbeiro</span></label>
                </fieldset>

                <button class="btn btn--contorno filtros__limpar" type="button" data-limpar>Limpar filtros</button>
              </form>
            </details>
          </aside>

          <!-- ===== RESULTADOS ===== -->
          <div class="produtos__resultados">
            <p class="produtos__contagem" id="produtos-contagem" aria-live="polite"></p>

            <ul class="produtos__grelha" id="produtos-grelha"></ul>

            <div class="produtos__vazio" id="produtos-vazio" hidden>
              <h2>Nenhum produto encontrado</h2>
              <p>Experimente outra pesquisa ou alargue os filtros.</p>
              <button class="btn btn--contorno" type="button" data-limpar>Limpar filtros</button>
            </div>
          </div>

        </div>

      </div>
    </section>

  </main>

</body>
</html>
