<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O meu perfil · Salgueiro's Barbearia</title>
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" href="assets/images/logo/logo-salgueiros.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/conta.css">
  <script src="js/dados.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/loja.js" defer></script>
  <script src="js/conta.js" defer></script>
</head>
<body data-pagina="conta">

  <!-- Navbar, menu mobile e rodapé são montados por js/main.js; o conteúdo do perfil por js/conta.js -->

  <main>

    <!-- ===== TOPO: QUEM É O CLIENTE ===== -->
    <section class="perfil-topo">
      <div class="container">
        <div class="perfil-topo__identidade">
          <span class="avatar avatar--grande" id="perfil-avatar" aria-hidden="true"></span>
          <div class="perfil-topo__texto">
            <h1 class="perfil-topo__nome" id="perfil-nome"></h1>
            <p class="perfil-topo__desde" id="perfil-desde"></p>
          </div>
          <a class="btn btn--primario" data-link="marcacoes" href="#">Marcar próximo corte</a>
        </div>
      </div>
    </section>

    <section class="perfil">
      <div class="container">

        <div class="separadores" role="tablist" aria-label="Secções do perfil">
          <button class="separadores__item" type="button" role="tab" id="sep-compras" aria-controls="painel-compras" aria-selected="true">Compras</button>
          <button class="separadores__item" type="button" role="tab" id="sep-dados" aria-controls="painel-dados" aria-selected="false" tabindex="-1">Os meus dados</button>
        </div>

        <!-- ===== COMPRAS ===== -->
        <div role="tabpanel" id="painel-compras" aria-labelledby="sep-compras">
          <div class="compras">

            <!-- Organizar as compras (coluna da esquerda em ecrãs largos) -->
            <aside class="compras__filtros" aria-label="Organizar as compras">
              <form id="compras-ordem">
                <fieldset class="compras__grupo">
                  <legend class="compras__titulo">Data da compra</legend>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="data-desc" checked><span>Mais recentes primeiro</span></label>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="data-asc"><span>Mais antigas primeiro</span></label>
                </fieldset>
                <fieldset class="compras__grupo">
                  <legend class="compras__titulo">Preço</legend>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="total-desc"><span>Total mais alto primeiro</span></label>
                  <label class="caixa"><input class="campo__caixa" type="radio" name="ordem" value="total-asc"><span>Total mais baixo primeiro</span></label>
                </fieldset>
              </form>
            </aside>

            <!-- Um cartão por compra, montado por js/conta.js -->
            <ul class="compras__lista" id="perfil-compras"></ul>

          </div>
        </div>

        <!-- ===== OS MEUS DADOS ===== -->
        <div role="tabpanel" id="painel-dados" aria-labelledby="sep-dados" hidden>
          <!-- Cartão com os dados; "Editar dados" torna os campos editáveis (js/conta.js) -->
          <form class="perfil-dados" id="perfil-form" novalidate>
            <div class="perfil-dados__topo">
              <div>
                <h2 class="perfil-dados__titulo">Dados pessoais</h2>
                <p class="perfil-dados__texto">É com estes dados que a barbearia o contacta sobre as suas compras.</p>
              </div>
              <button class="btn btn--contorno" type="button" id="dados-editar">Editar dados</button>
            </div>

            <div class="perfil-dados__linha">
              <span class="perfil-dados__icone" aria-hidden="true"><svg class="icone"><use href="#i-utilizador"></use></svg></span>
              <div class="campo campo--bloco">
                <label class="campo__rotulo" for="dado-nome">Nome</label>
                <input class="campo__controlo" type="text" autocomplete="name" required minlength="2" id="dado-nome" name="nome" readonly aria-describedby="dado-nome-erro">
                <p class="campo__erro" id="dado-nome-erro" aria-live="polite"></p>
              </div>
            </div>
            <div class="perfil-dados__linha">
              <span class="perfil-dados__icone" aria-hidden="true"><svg class="icone"><use href="#i-email"></use></svg></span>
              <div class="campo campo--bloco">
                <label class="campo__rotulo" for="dado-email">Email</label>
                <input class="campo__controlo" type="email" autocomplete="email" required id="dado-email" name="email" readonly aria-describedby="dado-email-erro">
                <p class="campo__erro" id="dado-email-erro" aria-live="polite"></p>
              </div>
            </div>
            <div class="perfil-dados__linha">
              <span class="perfil-dados__icone" aria-hidden="true"><svg class="icone"><use href="#i-telefone"></use></svg></span>
              <div class="campo campo--bloco">
                <label class="campo__rotulo" for="dado-telemovel">Telemóvel</label>
                <input class="campo__controlo" type="tel" autocomplete="tel" required pattern="\+?[0-9 ]{9,17}" id="dado-telemovel" name="telemovel" readonly aria-describedby="dado-telemovel-erro">
                <p class="campo__erro" id="dado-telemovel-erro" aria-live="polite"></p>
              </div>
            </div>

            <div class="perfil-dados__acoes" id="dados-acoes" hidden>
              <button class="btn btn--primario" type="submit" id="dados-guardar">Guardar alterações</button>
              <button class="btn btn--texto perfil-dados__cancelar" type="button" id="dados-cancelar">Cancelar</button>
            </div>
          </form>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
